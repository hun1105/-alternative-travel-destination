services:
  - type: web
    name: plan-b-api
    runtime: python
    plan: free
    branch: feature/recommend-category-filter
    buildCommand: echo "no external dependencies"
    startCommand: python -X utf8 -m plan_b_api.server --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: KTO_SERVICE_KEY
        sync: false
      - key: KMA_SERVICE_KEY
        sync: false
      - key: TMAP_APP_KEY
        sync: false
      - key: SEOUL_OPEN_API_KEY
        sync: false
      - key: ODSAY_API_KEY
        sync: false
      - key: KTO_MOBILE_APP
        sync: false
      - key: KTO_MOBILE_OS
        sync: false
      - key: KTO_BASE_URL
        sync: false
      - key: KTO_TIMEOUT_SECONDS
        sync: false
      - key: KTO_MAX_RETRIES
        sync: false
